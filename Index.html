<!DOCTYPE html>
<html lang="fr">

</style>
</head>

/* ================= ONGLET CONSEILS (coach local, sans clé) ================= */
function Conseils({ state }) {
    const profile = state.profiles[state.activeProfile];
    const expKey = `${state.activeProfile}|${state.activeMonth}`;
    const monthExp = state.expenses[expKey] || [];
    const spentByCat = (id) => monthExp.filter((e) => e.catId === id).reduce((s, e) => s + e.amount, 0);
    const income = profile.income || 0;
    const totalBudget = profile.categories.reduce((s, c) => s + (c.budget || 0), 0);
    const totalSpent = monthExp.reduce((s, e) => s + e.amount, 0);
    const reste = income - totalSpent;
    const sav = state.savings;
    const reparti = sav.envelopes.reduce((s, e) => s + (e.amount || 0), 0);
    const nonReparti = sav.total - reparti;
    const items = [];
    const push = (sev, text) => items.push({ sev, text });
    if (totalBudget > income && income > 0)
        push(1, `Tes budgets cumulés (${fmt(totalBudget)}) dépassent tes revenus (${fmt(income)}) de ${fmt(totalBudget - income)}. Allège un ou deux postes pour rester réaliste.`);
    const over = profile.categories.map((c) => ({ c, spent: spentByCat(c.id) })).filter((x) => x.spent > x.c.budget && x.spent > 0);
    over.sort((a, b) => (b.spent - b.c.budget) - (a.spent - a.c.budget));
    over.slice(0, 4).forEach((x) => push(0, `${x.c.emoji} ${x.c.name} : ${fmt(x.spent)} dépensés pour ${fmt(x.c.budget)} budgétés — dépassement de ${fmt(x.spent - x.c.budget)}.`));
    if (over.length === 0 && totalSpent > 0)
        push(3, `Aucun poste en dépassement ce mois-ci — beau travail. 👏`);
    if (reste < 0)
        push(0, `Tu as dépensé ${fmt(-reste)} de plus que tes revenus ce mois. Priorité : réduire les postes en dépassement ci-dessus.`);
    else if (income > 0) {
        const tx = reste / income;
        if (tx >= 0.2)
            push(3, `Il te reste ${fmt(reste)} ce mois (${Math.round(tx * 100)} % de tes revenus). Solide — verse-en une partie à ton épargne avant de la dépenser.`);
        else if (tx > 0)
            push(2, `Il te reste ${fmt(reste)} ce mois (${Math.round(tx * 100)} % de tes revenus). Vise plutôt ~20 % pour épargner sereinement.`);
        else
            push(1, `Tu as dépensé quasiment tous tes revenus : peu de marge pour l'épargne ce mois. Cherche 1–2 postes à réduire.`);
    }
    if (nonReparti > 0.5)
        push(2, `Tu as ${fmt(nonReparti)} d'épargne non répartie. Assigne-les à une enveloppe (Sécurité, Voyage…) pour donner un rôle à chaque euro.`);
    else if (nonReparti < -0.5)

    const secu = sav.envelopes.find((e) => /s[eé]curit|urgence|coup dur/i.test(e.name));
    const moisRef = totalBudget > 0 ? totalBudget : totalSpent;
    if (secu && moisRef > 0) {
        const mois = secu.amount / moisRef;
        if (mois < 3)
            push(2, `Ton enveloppe ${secu.emoji} ${secu.name} couvre ~${mois.toFixed(1)} mois de dépenses. Vise 3 à 6 mois, soit ${fmt(3 * moisRef)} à ${fmt(6 * moisRef)}.`);
        else if (mois <= 6)

        else
            push(2, `Ton fonds ${secu.name} couvre ~${mois.toFixed(1)} mois. Au-delà de 6 mois, tu peux orienter le surplus vers un projet (Voyage, Futur plaisir…).`);
    }

    if (near && near.pct >= 0.5)
        push(3, `Enveloppe ${near.e.emoji} ${near.e.name} : tu es à ${Math.round(near.pct * 100)} % de ton objectif. Encore ${fmt(near.e.goal - near.e.amount)} !`);
    if (totalSpent === 0)
        push(2, `Saisis d'abord tes dépenses du mois dans l'onglet Dépenses : les conseils s'affineront en direct.`);
    items.sort((a, b) => a.sev - b.sev);

        React.createElement("div", { className: "card" },

            React.createElement("p", { className: "sm muted", style: { margin: "10px 0 0" } },

                " \u00BB (",

                "). Tout est calcul\u00E9 dans ton navigateur \u2014 rien n'est envoy\u00E9 en ligne, aucune cl\u00E9 requise.")),
        React.createElement("div", { style: { marginTop: 12 } }, items.map((it, i) => (React.createElement("div", { key: i, className: "card", style: { marginTop: 8, borderLeft: `4px solid ${colors[it.sev]}` } },

            React.createElement("div", { className: "sm", style: { lineHeight: 1.55 } }, it.text))))),
